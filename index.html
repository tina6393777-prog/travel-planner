<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京家族旅行 5天4夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b3a42;
    --ink-soft:#5c6b73;
    --paper:#fdfcf9;
    --card:#ffffff;
    --line:#e8e3da;
    --sakura:#e0567f;
    --sakura-soft:#fbe9ef;
    --indigo:#34558b;
    --indigo-soft:#e9eef7;
    --gold:#b98a2e;
    --radius:14px;
    --shadow:0 2px 10px rgba(43,58,66,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans TC',sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.65;
    padding-bottom:90px;
  }
  /* ── 頁首 ───────────────────────── */
  header{
    background:linear-gradient(135deg,var(--indigo) 0%,#26406b 100%);
    color:#fff;
    padding:22px 18px 18px;
  }
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;max-width:720px;margin:0 auto}
  h1{font-family:'Zen Maru Gothic',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:.04em}
  .head-sub{font-size:.8rem;opacity:.85;margin-top:2px}
  .edit-btn{
    flex-shrink:0;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;text-decoration:none;
    font-size:.82rem;font-weight:500;
    padding:7px 13px;border-radius:999px;
    transition:background .2s;
  }
  .edit-btn:active{background:rgba(255,255,255,.3)}
  .refresh-note{max-width:720px;margin:8px auto 0;font-size:.72rem;opacity:.7}

  /* ── 分頁列（底部固定，手機好按） ── */
  nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    box-shadow:0 -2px 12px rgba(43,58,66,.08);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;border:none;background:none;cursor:pointer;
    font-family:inherit;font-size:.72rem;color:var(--ink-soft);
    padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  nav button .icn{font-size:1.25rem;line-height:1}
  nav button.on{color:var(--sakura);font-weight:700}
  nav button.on .icn{transform:translateY(-1px)}

  main{max-width:720px;margin:0 auto;padding:18px 16px}
  section{display:none}
  section.on{display:block}
  .sec-title{
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:1.05rem;font-weight:700;color:var(--indigo);
    margin:6px 0 14px;display:flex;align-items:center;gap:8px;
  }
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:15px 16px;margin-bottom:12px;
  }
  .muted{color:var(--ink-soft);font-size:.85rem}
  .loading,.empty{
    text-align:center;color:var(--ink-soft);
    padding:36px 12px;font-size:.9rem;
  }

  /* ── 行程：路線圖風格 ─────────────── */
  .day-tabs{
    display:flex;gap:0;overflow-x:auto;margin:2px 0 18px;
    -webkit-overflow-scrolling:touch;
    padding:6px 2px;
  }
  .day-stop{
    flex-shrink:0;border:none;background:none;cursor:pointer;
    font-family:inherit;
    display:flex;flex-direction:column;align-items:center;
    padding:0 4px;min-width:64px;position:relative;
  }
  .day-stop .dot{
    width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--indigo);
    z-index:1;transition:all .2s;
  }
  .day-stop::before,.day-stop::after{
    content:"";position:absolute;top:7px;height:3px;background:var(--indigo);width:50%;
  }
  .day-stop::before{left:0}
  .day-stop::after{right:0}
  .day-stop:first-child::before{display:none}
  .day-stop:last-child::after{display:none}
  .day-stop .lbl{font-size:.78rem;color:var(--ink-soft);margin-top:6px;font-weight:500;white-space:nowrap}
  .day-stop.on .dot{background:var(--sakura);border-color:var(--sakura);transform:scale(1.25)}
  .day-stop.on .lbl{color:var(--sakura);font-weight:700}

  .day-card .day-head{
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:1.02rem;font-weight:700;color:var(--ink);
    margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line);
  }
  .day-card .day-head .tag{
    display:inline-block;background:var(--sakura);color:#fff;
    font-size:.72rem;font-weight:700;letter-spacing:.05em;
    padding:2px 10px;border-radius:999px;margin-right:8px;vertical-align:2px;
  }
  .info-row{display:flex;gap:10px;margin-bottom:11px}
  .info-row:last-child{margin-bottom:0}
  .info-row .ic{flex-shrink:0;font-size:1rem;width:22px;text-align:center;padding-top:1px}
  .info-row .bd{flex:1;font-size:.9rem}
  .info-row .bd .k{font-size:.72rem;color:var(--ink-soft);font-weight:500;letter-spacing:.06em;display:block}
  .fare{color:var(--gold);font-weight:700}

  /* ── 航班/飯店 ───────────────────── */
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f2efe9;font-size:.9rem}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--ink-soft);flex-shrink:0}
  .kv .v{text-align:right;font-weight:500;word-break:break-all}
  .kv .v a{color:var(--indigo)}
  .card-h{
    font-weight:700;font-size:.95rem;color:var(--indigo);
    margin-bottom:8px;display:flex;align-items:center;gap:6px;
  }

  /* ── 成員 ───────────────────────── */
  .member{display:flex;align-items:center;gap:12px}
  .member .avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    background:var(--indigo-soft);color:var(--indigo);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:1.05rem;font-family:'Zen Maru Gothic',sans-serif;
  }
  .member .det{font-size:.8rem;color:var(--ink-soft)}
  .member .nm{font-weight:700;font-size:.95rem;color:var(--ink)}

  /* ── 記帳 ───────────────────────── */
  .total-band{
    background:var(--sakura-soft);border:1px solid #f3cddb;
    border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .total-band .amt{font-size:1.5rem;font-weight:700;color:var(--sakura);font-family:'Zen Maru Gothic',sans-serif}
  form.exp{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  form.exp input,form.exp select{
    font-family:inherit;font-size:.9rem;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;background:#fff;width:100%;
  }
  form.exp input:focus,form.exp select:focus{outline:2px solid var(--indigo-soft);border-color:var(--indigo)}
  form.exp .full{grid-column:1/-1}
  .file-lbl{
    grid-column:1/-1;display:flex;align-items:center;gap:8px;
    font-size:.85rem;color:var(--ink-soft);cursor:pointer;
    border:1px dashed var(--line);border-radius:9px;padding:9px 11px;background:#fff;
  }
  .file-lbl input{display:none}
  .add-btn{
    grid-column:1/-1;
    background:var(--sakura);color:#fff;border:none;cursor:pointer;
    font-family:inherit;font-size:.95rem;font-weight:700;
    padding:11px;border-radius:10px;letter-spacing:.05em;
  }
  .add-btn:active{opacity:.85}
  .exp-item{display:flex;gap:12px;align-items:center}
  .exp-item .cat{
    flex-shrink:0;width:38px;height:38px;border-radius:10px;
    background:var(--indigo-soft);display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  }
  .exp-item .mid{flex:1;min-width:0}
  .exp-item .ttl{font-weight:500;font-size:.92rem}
  .exp-item .sub{font-size:.76rem;color:var(--ink-soft)}
  .exp-item .amt{font-weight:700;color:var(--ink);white-space:nowrap}
  .exp-item .del{
    border:none;background:none;color:#c0b8ab;cursor:pointer;
    font-size:1rem;padding:4px;flex-shrink:0;
  }
  .receipt-thumb{
    width:38px;height:38px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);cursor:pointer;flex-shrink:0;
  }
  .device-note{font-size:.74rem;color:var(--ink-soft);margin:10px 2px 0}

  /* ── 行前清單 ────────────────────── */
  .chk{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid #f2efe9}
  .chk:last-child{border-bottom:none}
  .chk input{width:20px;height:20px;accent-color:var(--sakura);flex-shrink:0;cursor:pointer}
  .chk label{flex:1;font-size:.92rem;cursor:pointer}
  .chk.done label{color:#b5aea2;text-decoration:line-through}
  .chk .del{border:none;background:none;color:#c0b8ab;cursor:pointer;font-size:1rem;padding:4px}
  .chk-add{display:flex;gap:8px;margin-top:12px}
  .chk-add input{
    flex:1;font-family:inherit;font-size:.9rem;
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  }
  .chk-add button{
    background:var(--indigo);color:#fff;border:none;border-radius:9px;
    padding:0 18px;font-family:inherit;font-weight:700;cursor:pointer;
  }
  .progress{
    height:8px;background:#efeae1;border-radius:99px;overflow:hidden;margin:4px 0 14px;
  }
  .progress i{display:block;height:100%;background:var(--sakura);border-radius:99px;transition:width .3s}

  /* ── 收據放大 ────────────────────── */
  .lightbox{
    position:fixed;inset:0;background:rgba(20,25,30,.85);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:88vh;border-radius:10px}

  @media(min-width:600px){
    h1{font-size:1.55rem}
    form.exp{grid-template-columns:1fr 1fr 1fr 1fr}
    form.exp .full,form.exp .add-btn,.file-lbl{grid-column:1/-1}
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div>
      <h1>🌸 東京家族旅行</h1>
      <div class="head-sub">5 天 4 夜 ・ 上野出發的下町散步</div>
    </div>
    <a class="edit-btn" id="editBtn" href="#" target="_blank" rel="noopener">📝 編輯</a>
  </div>
  <div class="refresh-note">資料來自 Google Sheets，重新整理頁面即可看到最新內容</div>
</header>

<main>
  <!-- 行程 -->
  <section id="sec-itin" class="on">
    <div class="sec-title">每日行程</div>
    <div class="day-tabs" id="dayTabs"></div>
    <div id="itinBody"><div class="loading">行程載入中…</div></div>
  </section>

  <!-- 航班・飯店 -->
  <section id="sec-trip">
    <div class="sec-title">航班資訊</div>
    <div id="flightBody"><div class="loading">載入中…</div></div>
    <div class="sec-title" style="margin-top:22px">飯店資訊</div>
    <div id="hotelBody"><div class="loading">載入中…</div></div>
  </section>

  <!-- 成員 -->
  <section id="sec-mem">
    <div class="sec-title">親友名單</div>
    <div id="memBody"><div class="loading">載入中…</div></div>
  </section>

  <!-- 記帳 -->
  <section id="sec-exp">
    <div class="sec-title">旅費記帳</div>
    <div class="total-band">
      <span class="muted">目前總支出</span>
      <span class="amt" id="expTotal">¥0</span>
    </div>
    <div class="card">
      <form class="exp" id="expForm">
        <input class="full" id="expTitle" placeholder="項目（例：築地海鮮丼）" required>
        <input id="expAmt" type="number" inputmode="numeric" min="0" placeholder="金額（日圓）" required>
        <select id="expCat">
          <option value="🍜">🍜 餐飲</option>
          <option value="🚃">🚃 交通</option>
          <option value="🛍️">🛍️ 購物</option>
          <option value="🎟️">🎟️ 門票</option>
          <option value="🏨">🏨 住宿</option>
          <option value="💴">💴 其他</option>
        </select>
        <input id="expPayer" placeholder="付款人（選填）">
        <select id="expDay">
          <option value="">哪一天？（選填）</option>
          <option>Day 1</option><option>Day 2</option><option>Day 3</option>
          <option>Day 4</option><option>Day 5</option>
        </select>
        <label class="file-lbl">
          📷 <span id="fileLblTxt">拍照或上傳收據（選填）</span>
          <input type="file" id="expFile" accept="image/*">
        </label>
        <button class="add-btn" type="submit">＋ 新增一筆</button>
      </form>
    </div>
    <div id="expList"></div>
    <div class="device-note">＊記帳資料只存在自己這支手機裡，不會同步給其他人</div>
  </section>

  <!-- 行前清單 -->
  <section id="sec-chk">
    <div class="sec-title">行前檢查清單</div>
    <div class="muted" id="chkStat" style="margin-bottom:4px"></div>
    <div class="progress"><i id="chkBar" style="width:0%"></i></div>
    <div class="card" id="chkList"></div>
    <div class="chk-add">
      <input id="chkNew" placeholder="新增自己的待辦項目…">
      <button id="chkAddBtn">加入</button>
    </div>
    <div class="device-note">＊勾選狀態只存在自己這支手機裡</div>
  </section>
</main>

<nav>
  <button data-sec="sec-itin" class="on"><span class="icn">🗓️</span>行程</button>
  <button data-sec="sec-trip"><span class="icn">✈️</span>航班飯店</button>
  <button data-sec="sec-mem"><span class="icn">👨‍👩‍👧‍👦</span>成員</button>
  <button data-sec="sec-exp"><span class="icn">💴</span>記帳</button>
  <button data-sec="sec-chk"><span class="icn">✅</span>清單</button>
</nav>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="收據"></div>

<script>
/* ════════════════════════════════════════
   基本設定
════════════════════════════════════════ */
const SHEET_ID = '1U6TXAnCzci6X39Lg0xyNZVxPJN7k39FDuv-WoV_LUSA';
const SHEETS = {
  flight: '航班資訊',
  hotel:  '飯店資訊',
  member: '親友名單',
  itin:   '行程— 每日行程'
};
document.getElementById('editBtn').href =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

function sheetUrl(name){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
}

/* CSV 解析：處理引號內含逗號、換行（日文地址常見） */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){
        if(text[i+1]==='"'){cell+='"';i++;}
        else q=false;
      }else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(c!=='\r') cell+=c;
    }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}

/* 轉成物件陣列：第一列當欄位名 */
function toObjects(rows){
  if(rows.length<2) return [];
  const heads=rows[0].map(h=>h.trim());
  return rows.slice(1)
    .filter(r=>r.some(c=>c && c.trim()!==''))
    .map(r=>{
      const o={};
      heads.forEach((h,i)=>o[h]=(r[i]||'').trim());
      return o;
    });
}

async function fetchSheet(name){
  try{
    const res=await fetch(sheetUrl(name));
    if(!res.ok) throw new Error(res.status);
    return toObjects(parseCSV(await res.text()));
  }catch(e){
    console.log(`讀取「${name}」失敗：`,e);
    return null; /* 失敗回 null，畫面不壞 */
  }
}

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ════════════════════════════════════════
   行程（新欄位：天數/重點行程/交通方式/預估車資/餐廳推薦）
════════════════════════════════════════ */
let itinDays=[]; /* [{day:'Day 1', rows:[...]}] */

function renderDayTabs(activeIdx){
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML=itinDays.map((d,i)=>`
    <button class="day-stop ${i===activeIdx?'on':''}" data-i="${i}">
      <span class="dot"></span><span class="lbl">${esc(d.day)}</span>
    </button>`).join('');
  tabs.querySelectorAll('.day-stop').forEach(b=>{
    b.onclick=()=>showDay(+b.dataset.i);
  });
}

function showDay(idx){
  renderDayTabs(idx);
  const d=itinDays[idx];
  const body=document.getElementById('itinBody');
  body.innerHTML=d.rows.map(r=>{
    const blocks=[];
    if(r['重點行程']) blocks.push(`
      <div class="info-row"><span class="ic">📍</span>
        <div class="bd"><span class="k">重點行程</span>${esc(r['重點行程'])}</div></div>`);
    if(r['交通方式']) blocks.push(`
      <div class="info-row"><span class="ic">🚃</span>
        <div class="bd"><span class="k">交通方式</span>${esc(r['交通方式'])}</div></div>`);
    if(r['預估車資']) blocks.push(`
      <div class="info-row"><span class="ic">💴</span>
        <div class="bd"><span class="k">預估車資（每人）</span><span class="fare">${esc(r['預估車資'])}</span></div></div>`);
    if(r['餐廳推薦']) blocks.push(`
      <div class="info-row"><span class="ic">🍽️</span>
        <div class="bd"><span class="k">餐廳推薦</span>${esc(r['餐廳推薦'])}</div></div>`);
    /* 其他自訂欄位也一併顯示，管理者以後加欄位不用改程式 */
    Object.keys(r).forEach(k=>{
      if(!['天數','重點行程','交通方式','預估車資','餐廳推薦'].includes(k) && r[k]){
        blocks.push(`
      <div class="info-row"><span class="ic">📝</span>
        <div class="bd"><span class="k">${esc(k)}</span>${esc(r[k])}</div></div>`);
      }
    });
    return `<div class="card day-card">
      <div class="day-head"><span class="tag">${esc(d.day)}</span>今日路線</div>
      ${blocks.join('')||'<div class="muted">這天還沒填內容</div>'}
    </div>`;
  }).join('');
}

function renderItin(data){
  const body=document.getElementById('itinBody');
  if(data===null){
    body.innerHTML='<div class="empty">行程暫時讀不到，請確認 Google Sheets 共用設定為「知道連結的人可檢視」，再重新整理。</div>';
    return;
  }
  if(!data.length){
    body.innerHTML='<div class="empty">行程工作表還是空的，點右上「📝 編輯」開始填吧！</div>';
    return;
  }
  /* 依「天數」分組，保持出現順序 */
  const map=new Map();
  data.forEach(r=>{
    const day=r['天數']||'未分類';
    if(!map.has(day)) map.set(day,[]);
    map.get(day).push(r);
  });
  itinDays=[...map.entries()].map(([day,rows])=>({day,rows}));
  showDay(0);
}

/* ════════════════════════════════════════
   航班 / 飯店 / 成員
════════════════════════════════════════ */
function kvCard(title,icon,obj,mapLinkKeys=[]){
  const rows=Object.entries(obj)
    .filter(([,v])=>v)
    .map(([k,v])=>{
      let val=esc(v);
      if(mapLinkKeys.includes(k)){
        val=`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v)}" target="_blank" rel="noopener">${esc(v)} ↗</a>`;
      }
      return `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${val}</span></div>`;
    }).join('');
  return `<div class="card"><div class="card-h">${icon} ${esc(title)}</div>${rows}</div>`;
}

function renderFlight(data){
  const el=document.getElementById('flightBody');
  if(data===null){el.innerHTML='<div class="empty">航班資訊暫時讀不到</div>';return;}
  if(!data.length){el.innerHTML='<div class="empty">還沒填航班資訊</div>';return;}
  el.innerHTML=data.map((r,i)=>kvCard(r['目的地']||`航班 ${i+1}`,'✈️',r)).join('');
}

function renderHotel(data){
  const el=document.getElementById('hotelBody');
  if(data===null){el.innerHTML='<div class="empty">飯店資訊暫時讀不到</div>';return;}
  if(!data.length){el.innerHTML='<div class="empty">還沒填飯店資訊</div>';return;}
  el.innerHTML=data.map((r,i)=>{
    const title=r['第一晚飯店']||r['飯店名稱']||`飯店 ${i+1}`;
    return kvCard(title,'🏨',r,['飯店地址']);
  }).join('');
}

function renderMembers(data){
  const el=document.getElementById('memBody');
  if(data===null){el.innerHTML='<div class="empty">親友名單暫時讀不到</div>';return;}
  if(!data.length){el.innerHTML='<div class="empty">還沒填親友名單</div>';return;}
  el.innerHTML=data.map(m=>{
    const name=m['姓名']||'？';
    const dets=[];
    if(m['電話']) dets.push('📱 '+esc(m['電話']));
    if(m['護照效期']) dets.push('🛂 護照效期 '+esc(m['護照效期']));
    if(m['備註']) dets.push('📝 '+esc(m['備註']));
    return `<div class="card member">
      <div class="avatar">${esc(name.charAt(0))}</div>
      <div><div class="nm">${esc(name)}</div><div class="det">${dets.join('　')||'&nbsp;'}</div></div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════
   記帳（存在各自手機 localStorage）
════════════════════════════════════════ */
const EXP_KEY='tokyo_trip_expenses_v2';
let expenses=[];
try{expenses=JSON.parse(localStorage.getItem(EXP_KEY)||'[]');}catch(e){expenses=[];}

function saveExp(){
  try{localStorage.setItem(EXP_KEY,JSON.stringify(expenses));}
  catch(e){alert('儲存空間滿了，可能是收據照片太多，刪掉幾筆舊的再試試');}
}

function renderExp(){
  const list=document.getElementById('expList');
  const total=expenses.reduce((s,e)=>s+(+e.amt||0),0);
  document.getElementById('expTotal').textContent='¥'+total.toLocaleString();
  if(!expenses.length){
    list.innerHTML='<div class="empty">還沒有記帳資料，上面新增第一筆吧！</div>';
    return;
  }
  list.innerHTML=expenses.map((e,i)=>`
    <div class="card exp-item">
      <div class="cat">${e.cat}</div>
      <div class="mid">
        <div class="ttl">${esc(e.title)}</div>
        <div class="sub">${[e.day,e.payer&&('付款：'+esc(e.payer))].filter(Boolean).join('　')}</div>
      </div>
      ${e.img?`<img class="receipt-thumb" src="${e.img}" data-i="${i}" alt="收據縮圖">`:''}
      <div class="amt">¥${(+e.amt).toLocaleString()}</div>
      <button class="del" data-i="${i}" aria-label="刪除">✕</button>
    </div>`).join('');
  list.querySelectorAll('.del').forEach(b=>{
    b.onclick=()=>{
      if(confirm('刪除這筆記帳？')){expenses.splice(+b.dataset.i,1);saveExp();renderExp();}
    };
  });
  list.querySelectorAll('.receipt-thumb').forEach(t=>{
    t.onclick=()=>{
      document.getElementById('lightboxImg').src=expenses[+t.dataset.i].img;
      document.getElementById('lightbox').classList.add('on');
    };
  });
}
document.getElementById('lightbox').onclick=function(){this.classList.remove('on');};

/* 收據照片壓縮成小圖再存，避免撐爆手機空間 */
let pendingImg='';
document.getElementById('expFile').onchange=function(){
  const f=this.files[0];
  if(!f){pendingImg='';return;}
  const img=new Image();
  img.onload=()=>{
    const MAX=900;
    const scale=Math.min(1,MAX/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=img.width*scale; cv.height=img.height*scale;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    pendingImg=cv.toDataURL('image/jpeg',.7);
    document.getElementById('fileLblTxt').textContent='✔ 已選擇收據照片';
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
};

document.getElementById('expForm').onsubmit=function(ev){
  ev.preventDefault();
  const title=document.getElementById('expTitle').value.trim();
  const amt=document.getElementById('expAmt').value;
  if(!title||!amt) return;
  expenses.unshift({
    title, amt,
    cat:document.getElementById('expCat').value,
    payer:document.getElementById('expPayer').value.trim(),
    day:document.getElementById('expDay').value,
    img:pendingImg
  });
  saveExp(); renderExp();
  this.reset(); pendingImg='';
  document.getElementById('fileLblTxt').textContent='拍照或上傳收據（選填）';
};

/* ════════════════════════════════════════
   行前清單（存在各自手機 localStorage）
════════════════════════════════════════ */
const CHK_KEY='tokyo_trip_checklist_v2';
const CHK_DEFAULTS=[
  '護照（效期6個月以上）','日圓現金','網卡 / 漫遊開通','Suica / 交通IC卡',
  '飯店訂房確認信','機票 / 登機證','常用藥品','行動電源','雨傘 / 雨衣','舒服好走的鞋'
];
let checklist;
try{
  checklist=JSON.parse(localStorage.getItem(CHK_KEY));
  if(!Array.isArray(checklist)) throw 0;
}catch(e){
  checklist=CHK_DEFAULTS.map(t=>({t,done:false}));
}
function saveChk(){localStorage.setItem(CHK_KEY,JSON.stringify(checklist));}

function renderChk(){
  const el=document.getElementById('chkList');
  const done=checklist.filter(c=>c.done).length;
  document.getElementById('chkStat').textContent=`完成 ${done} / ${checklist.length} 項`;
  document.getElementById('chkBar').style.width=
    (checklist.length?Math.round(done/checklist.length*100):0)+'%';
  el.innerHTML=checklist.map((c,i)=>`
    <div class="chk ${c.done?'done':''}">
      <input type="checkbox" id="chk${i}" ${c.done?'checked':''} data-i="${i}">
      <label for="chk${i}">${esc(c.t)}</label>
      <button class="del" data-i="${i}" aria-label="刪除">✕</button>
    </div>`).join('');
  el.querySelectorAll('input').forEach(b=>{
    b.onchange=()=>{checklist[+b.dataset.i].done=b.checked;saveChk();renderChk();};
  });
  el.querySelectorAll('.del').forEach(b=>{
    b.onclick=()=>{checklist.splice(+b.dataset.i,1);saveChk();renderChk();};
  });
}
document.getElementById('chkAddBtn').onclick=()=>{
  const inp=document.getElementById('chkNew');
  const t=inp.value.trim();
  if(!t) return;
  checklist.push({t,done:false});
  saveChk(); renderChk(); inp.value='';
};
document.getElementById('chkNew').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('chkAddBtn').click();
});

/* ════════════════════════════════════════
   分頁切換
════════════════════════════════════════ */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('main section').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById(b.dataset.sec).classList.add('on');
    window.scrollTo({top:0});
  };
});

/* ════════════════════════════════════════
   啟動：四張工作表同時抓
════════════════════════════════════════ */
(async function init(){
  const [flight,hotel,member,itin]=await Promise.all([
    fetchSheet(SHEETS.flight),
    fetchSheet(SHEETS.hotel),
    fetchSheet(SHEETS.member),
    fetchSheet(SHEETS.itin)
  ]);
  renderFlight(flight);
  renderHotel(hotel);
  renderMembers(member);
  renderItin(itin);
  renderExp();
  renderChk();
})();
</script>
